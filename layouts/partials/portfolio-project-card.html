<article class="portfolio-project-card">
  <div class="portfolio-project-card__topline">
    <span>{{ with .Params.categories }}{{ index . 0 }}{{ else }}Project{{ end }}</span>
    <span>{{ printf "%02d" (.Weight | default 0) }}</span>
  </div>
  <div>
    <h3><a href="{{ .RelPermalink }}">{{ .Title | emojify }}</a></h3>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </div>
  {{ with .Params.tags }}
    <ul class="portfolio-tag-list" aria-label="Technologies">
      {{ range first 5 . }}<li>{{ . }}</li>{{ end }}
    </ul>
  {{ end }}
  <span class="portfolio-project-card__arrow" aria-hidden="true">↗</span>
</article>
