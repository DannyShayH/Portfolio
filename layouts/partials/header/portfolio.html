<header class="portfolio-header print:hidden">
  <div class="portfolio-header__inner">
    <a class="portfolio-wordmark" href="{{ "" | relLangURL }}" aria-label="Daniel Halawi — home">
      <span>Daniel</span><span class="portfolio-wordmark__muted">Halawi</span>
    </a>

    <nav class="portfolio-nav" aria-label="Primary navigation">
      <a href="{{ "" | relLangURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>Home</a>
      <a href="{{ "posts/" | relLangURL }}"{{ if eq .Section "posts" }} aria-current="page"{{ end }}>Projects</a>
      <a href="{{ "tags/" | relLangURL }}"{{ if eq .Data.Singular "tag" }} aria-current="page"{{ end }}>Tags</a>
    </nav>

    {{ if .Site.Params.enableSearch | default false }}
      <div class="portfolio-search-desktop" data-search-root data-url="{{ "" | absLangURL }}">
        <label class="portfolio-search-pill" for="search-query-desktop">
          <span aria-hidden="true">{{ partial "icon.html" "search" }}</span>
          <span class="sr-only">Search projects, articles, and tags</span>
          <input
            id="search-query-desktop"
            data-search-input
            type="search"
            inputmode="search"
            autocomplete="off"
            placeholder="Search"
            aria-controls="desktop-search-panel"
            aria-expanded="false">
          <kbd>/</kbd>
        </label>
        <div id="desktop-search-panel" class="portfolio-search-panel" data-search-panel hidden>
          {{ partial "search-content.html" (dict "suffix" "desktop") }}
        </div>
      </div>
    {{ end }}

    <div class="portfolio-header__mobile-actions">
      {{ if .Site.Params.enableSearch | default false }}
        <button
          id="search-button-mobile"
          class="portfolio-icon-button"
          type="button"
          aria-label="Open search"
          aria-controls="search-wrapper"
          aria-expanded="false">
          {{ partial "icon.html" "search" }}
        </button>
      {{ end }}
      <button
        id="portfolio-menu-button"
        class="portfolio-icon-button"
        type="button"
        aria-expanded="false"
        aria-controls="portfolio-mobile-menu"
        aria-label="Open navigation">
        <span data-menu-open-icon>{{ partial "icon.html" "bars" }}</span>
        <span data-menu-close-icon hidden>{{ partial "icon.html" "xmark" }}</span>
      </button>
    </div>
  </div>

  <nav id="portfolio-mobile-menu" class="portfolio-mobile-menu" aria-label="Mobile navigation" hidden>
    <a href="{{ "" | relLangURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>Home</a>
    <a href="{{ "posts/" | relLangURL }}"{{ if eq .Section "posts" }} aria-current="page"{{ end }}>Projects</a>
    <a href="{{ "tags/" | relLangURL }}"{{ if eq .Data.Singular "tag" }} aria-current="page"{{ end }}>Tags</a>
  </nav>
</header>
