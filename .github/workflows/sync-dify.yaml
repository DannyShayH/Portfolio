name: Sync portfolio knowledge to Dify

on:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "upload_to_dify.py"
      - "requirements-dify.txt"
      - ".github/workflows/sync-dify.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dify-portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sync dependency
        run: python -m pip install --requirement requirements-dify.txt

      - name: Sync content
        env:
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          DIFY_DATASET_ID: d8da0442-1e75-4f3b-b152-48225e98487c
          DIFY_BASE_URL: https://api.dify.ai/v1
          DIFY_WRITE_DELAY_SECONDS: "5"
        run: python upload_to_dify.py
