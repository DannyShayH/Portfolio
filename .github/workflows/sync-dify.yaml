name: Sync portfolio knowledge to Dify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dify-portfolio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.content.outputs.files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sync dependency
        run: python -m pip install --requirement requirements-dify.txt

      - name: Discover content pages
        id: content
        run: echo "files=$(python upload_to_dify.py --list-files-json)" >> "$GITHUB_OUTPUT"

  sync:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.files) }}
    env:
      DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
      DIFY_DATASET_ID: d8da0442-1e75-4f3b-b152-48225e98487c
      DIFY_BASE_URL: https://api.dify.ai/v1
      DIFY_WRITE_DELAY_SECONDS: "5"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dify.txt

      - name: Install sync dependency
        run: python -m pip install --requirement requirements-dify.txt

      - name: Sync content
        env:
          CONTENT_FILE: ${{ matrix.file }}
        run: python upload_to_dify.py --file "$CONTENT_FILE"
